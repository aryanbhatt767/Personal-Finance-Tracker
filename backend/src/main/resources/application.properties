# ===== Server =====
server.port=8080

# ===== H2 In-Memory DB (dev) =====
spring.datasource.url=jdbc:h2:mem:fintrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== MySQL (uncomment for production) =====
# spring.datasource.url=jdbc:mysql://localhost:3306/fintrackdb?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT =====
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Logging =====
logging.level.com.fintrack=DEBUG
logging.level.org.springframework.security=WARN
